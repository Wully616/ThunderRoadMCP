name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish host
        shell: pwsh
        run: dotnet publish src/ThunderRoadMcp.Host/ThunderRoadMcp.Host.csproj -c Release -o "$env:RUNNER_TEMP/host"

      - name: Run host behavior check
        shell: pwsh
        run: dotnet run --project tests/HostBehaviorCheck -c Release -- "$env:RUNNER_TEMP/host/ThunderRoadMcp.Host.dll"

      - name: Validate tracked bridge packages
        shell: pwsh
        run: |
          function Test-BridgePackage([string]$PackagePath) {
            $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $PackagePath).Path)
            try {
              $seen = @{}
              $hasBridge = $false
              $hasManifest = $false
              $payloadCount = 0
              foreach ($entry in $archive.Entries) {
                $relativePath = $entry.FullName.Replace('\', '/')
                $isDirectory = $relativePath.EndsWith('/')
                if ($isDirectory) { $relativePath = $relativePath.TrimEnd('/') }
                if ($relativePath.Length -eq 0 -or $relativePath.StartsWith('/') -or
                    @($relativePath.Split('/') | Where-Object { $_ -eq '' -or $_ -eq '.' -or $_ -eq '..' -or $_.Contains(':') }).Count -gt 0) {
                  throw "Bridge package '$PackagePath' entry has an unsafe path: '$($entry.FullName)'"
                }
                $key = $relativePath + $(if ($isDirectory) { '/' } else { '' })
                if ($seen.ContainsKey($key)) { throw "Bridge package '$PackagePath' contains a duplicate path: '$($entry.FullName)'" }
                $seen[$key] = $true

                if ($isDirectory) {
                  if ($relativePath -ne 'runtime') { throw "Bridge package '$PackagePath' contains an unexpected directory: '$($entry.FullName)'" }
                  continue
                }
                if ($relativePath -eq 'ThunderRoadMcp.Bridge.dll') { $hasBridge = $true; continue }
                if ($relativePath -eq 'manifest.json') {
                  $reader = New-Object IO.StreamReader($entry.Open())
                  try { $manifest = $reader.ReadToEnd() | ConvertFrom-Json } finally { $reader.Dispose() }
                  if ($manifest.Name -ne 'ThunderRoadMcp') { throw "Bridge package '$PackagePath' manifest.json must identify the package as ThunderRoadMcp." }
                  $hasManifest = $true
                  continue
                }
                if ($relativePath -match '^runtime/[^/]+\.dll\.payload$') {
                  if ($relativePath -match '^runtime/(Unity|ThunderRoad(?!Mcp)|Assembly-CSharp|Newtonsoft\.Json).*\.dll\.payload$') {
                    throw "Bridge package '$PackagePath' contains a game dependency payload: '$relativePath'"
                  }
                  $payloadCount++
                  continue
                }
                if ($relativePath.EndsWith('.dll', [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Bridge package '$PackagePath' contains a game or unexpected DLL entry: '$relativePath'"
                }
                throw "Bridge package '$PackagePath' contains an unexpected entry: '$relativePath'"
              }
              if (-not $hasBridge -or -not $hasManifest -or $payloadCount -eq 0) {
                throw "Bridge package '$PackagePath' must contain ThunderRoadMcp.Bridge.dll, manifest.json, and at least one runtime/*.dll.payload file."
              }
            } finally { $archive.Dispose() }
          }

          $metadataPath = 'dist/bridge/versions.json'
          if (-not (Test-Path -LiteralPath $metadataPath -PathType Leaf)) {
            throw "Missing bridge version metadata: $metadataPath"
          }
          try { $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json }
          catch { throw "Invalid bridge version metadata in $metadataPath : $($_.Exception.Message)" }

          $versionEntries = @($metadata.versions)
          if ($versionEntries.Count -eq 0) {
            throw "$metadataPath must contain at least one version entry."
          }

          $latest = [string]$metadata.latest
          if ([string]::IsNullOrWhiteSpace($latest)) {
            throw "$metadataPath must define a non-empty 'latest' game version."
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $seenVersions = @{}
          $seenPackages = @{}
          foreach ($versionEntry in $versionEntries) {
            $gameVersion = [string]$versionEntry.gameVersion
            if ([string]::IsNullOrWhiteSpace($gameVersion)) {
              throw "$metadataPath contains an entry with no gameVersion."
            }
            if ($seenVersions.ContainsKey($gameVersion)) {
              throw "$metadataPath contains duplicate gameVersion '$gameVersion'."
            }
            $seenVersions[$gameVersion] = $true

            $packageName = [string]$versionEntry.package
            if ($packageName -notmatch '^[A-Za-z0-9._-]+\.zip$') {
              throw "Bridge package name is invalid for game $gameVersion : '$packageName'."
            }
            if ($seenPackages.ContainsKey($packageName)) {
              throw "$metadataPath contains duplicate package '$packageName'."
            }
            $seenPackages[$packageName] = $true

            $packagePath = Join-Path 'dist/bridge' $packageName
            if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
              throw "Bridge package is missing for game $gameVersion : $packagePath"
            }
            Test-BridgePackage $packagePath
          }

          if (-not $seenVersions.ContainsKey($latest)) {
            throw "$metadataPath latest '$latest' does not match any gameVersion."
          }
          Write-Host "Validated $($versionEntries.Count) bridge package(s) for games: $([string]::Join(', ', @($versionEntries | ForEach-Object { [string]$_.gameVersion }))). Latest: $latest"

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts, tests -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            foreach ($parseError in $errors) {
              $failed = $true
              Write-Error "$($parseError.Extent.File):$($parseError.Extent.StartLineNumber): $($parseError.Message)"
            }
          }
          if ($failed) { exit 1 }
